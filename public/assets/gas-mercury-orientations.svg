<svg xmlns="http://www.w3.org/2000/svg" width="520" height="570" viewBox="0 0 520 570" role="img" aria-labelledby="title desc">
  <title id="title">Two orientations of the mercury plug</title>
  <desc id="desc">Left: the tube is closed at the top, with trapped gas above mercury and the lower mercury face exposed to atmosphere through the open tube. Right: the tube is closed below, with trapped gas below mercury and the upper face exposed to atmosphere. The mercury height is 0.200 metres in both.</desc>
  <rect width="520" height="570" rx="16" fill="#f8fbfa"/>
  <g font-family="Arial, sans-serif" fill="#183e59" font-size="20" text-anchor="middle">
    <text x="130" y="36" font-weight="bold">Sealed end above</text>
    <text x="390" y="36" font-weight="bold">Sealed end below</text>
  </g>
  <rect x="85" y="82" width="90" height="148" fill="#d9efec"/>
  <rect x="85" y="230" width="90" height="86" fill="#8997a6"/>
  <rect x="345" y="230" width="90" height="86" fill="#8997a6"/>
  <rect x="345" y="316" width="90" height="112" fill="#d9efec"/>
  <g fill="none" stroke="#183e59" stroke-width="4">
    <path d="M85 390V82H175V390"/>
    <path d="M345 150V428H435V150"/>
    <path d="M190 230h15 M198 230v86 M190 316h15 M450 230h15 M458 230v86 M450 316h15" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#183e59" font-size="21" text-anchor="middle">
    <text x="130" y="145">Trapped</text><text x="130" y="174">gas</text>
    <text x="130" y="280" fill="white">Hg</text>
    <text x="390" y="280" fill="white">Hg</text>
    <text x="390" y="359">Trapped</text><text x="390" y="388">gas</text>
    <text x="130" y="416">Open to air</text>
    <text x="390" y="112">Open to air</text>
    <text x="130" y="468">Gas length</text><text x="130" y="497">0.400 m</text>
    <text x="390" y="468">Gas length</text><text x="390" y="497">0.240 m</text>
    <text x="260" y="544">Hg = mercury; plug height = 0.200 m</text>
  </g>
  <path d="M130 346v-22 M390 185v36" fill="none" stroke="#c47b35" stroke-width="3"/>
  <path d="M123 331l7-8 7 8 M383 214l7 8 7-8" fill="none" stroke="#c47b35" stroke-width="3"/>
</svg>
