<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
<title id="title">Energy pathways of a model leaf</title><desc id="desc">Absorbed light enters a model leaf. A dashed connection links the air to the leaf and its transfer direction must be decided from temperatures in the question. Evaporating water carries latent energy away.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#197d74"/></marker></defs>
<rect width="560" height="360" rx="15" fill="#f8fbfa"/>
<rect x="188" y="140" width="184" height="87" rx="30" fill="#dceeea" stroke="#197d74" stroke-width="3"/>
<g font-family="Arial,sans-serif" fill="#183e59" font-size="21" text-anchor="middle"><text x="280" y="191" font-weight="bold">Model leaf</text><text x="104" y="76">Absorbed light</text><text x="110" y="286">Surrounding air</text><text x="437" y="75">Water vapour</text><text x="437" y="105">+ latent energy</text><text x="280" y="329">Use temperatures to direct air exchange</text></g>
<g fill="none" stroke="#197d74" stroke-width="3" marker-end="url(#arrow)"><path d="M105 90L212 137"/><path d="M374 161L457 116"/></g>
<path d="M116 259L204 223" fill="none" stroke="#c47b35" stroke-width="3" stroke-dasharray="7 5"/>
</svg>
