<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-label="Signed oxygen changes over 20 minutes: A mass 2 grams, light plus 10, light blank plus 2, dark minus 4, dark blank minus 1 milligrams; B mass 3 grams, light plus 18, light blank plus 3, dark minus 3, dark blank plus 1 milligrams."><rect width="600" height="380" rx="16" fill="#edf7f6"/><style>text{font:22px Arial,sans-serif;fill:#183e50}.head{font-size:24px;font-weight:700}</style><text class="head" x="24" y="38">Signed O₂ change over 20 min</text><path d="M24 100H576M24 150H576M24 200H576M24 250H576M24 300H576" stroke="#a1bfc1"/><text x="352" y="82">A</text><text x="482" y="82">B</text><text x="24" y="132">Fresh plant mass / g</text><text x="345" y="132">2.0</text><text x="475" y="132">3.0</text><text x="24" y="182">Light plant / mg</text><text x="345" y="182">+10</text><text x="475" y="182">+18</text><text x="24" y="232">Light blank / mg</text><text x="345" y="232">+2</text><text x="475" y="232">+3</text><text x="24" y="282">Dark plant / mg</text><text x="345" y="282">−4</text><text x="475" y="282">−3</text><text x="24" y="332">Dark blank / mg</text><text x="345" y="332">−1</text><text x="475" y="332">+1</text><text x="24" y="368" font-size="18">+ gain of oxygen; − loss of oxygen</text></svg>