<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 480" role="img"><rect width="410" height="480" rx="12" fill="#f2f8f8"/><g font-family="Arial,sans-serif" fill="#183e59" font-size="18"><text x="24" y="34" font-size="18" text-anchor="start" fill="#183e59">DAUGHTER NUCLEUS: TRACK A AND Z</text><rect x="14" y="60" width="382" height="103" rx="10" fill="white"/><text x="30" y="94" font-size="20" text-anchor="start" fill="#183e59">Alpha α</text><text x="228" y="96" font-size="21" text-anchor="start" fill="#183e59">A → A − 4</text><text x="228" y="136" font-size="21" text-anchor="start" fill="#183e59">Z → Z − 2</text><rect x="14" y="175" width="382" height="103" rx="10" fill="white"/><text x="30" y="209" font-size="20" text-anchor="start" fill="#183e59">Beta-minus β⁻</text><text x="228" y="211" font-size="21" text-anchor="start" fill="#183e59">A unchanged</text><text x="228" y="251" font-size="21" text-anchor="start" fill="#183e59">Z → Z + 1</text><rect x="14" y="290" width="382" height="103" rx="10" fill="white"/><text x="30" y="324" font-size="20" text-anchor="start" fill="#183e59">Gamma γ</text><text x="228" y="326" font-size="21" text-anchor="start" fill="#183e59">A unchanged</text><text x="228" y="366" font-size="21" text-anchor="start" fill="#183e59">Z unchanged</text><text x="24" y="430" font-size="18" text-anchor="start" fill="#183e59">A: protons + neutrons</text><text x="24" y="458" font-size="18" text-anchor="start" fill="#183e59">Z: protons; neutron count = A − Z</text></g></svg>