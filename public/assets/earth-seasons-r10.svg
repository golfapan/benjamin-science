<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Two positions in Earth's orbit. The axes stay parallel: north tilted toward the Sun on the left, away on the right."><rect width="600" height="340" rx="16" fill="#edf7f6"/><style>text{font:20px Arial,sans-serif;fill:#183e50}.head{font-size:24px;font-weight:700}</style><text class="head" x="24" y="36">Axial tilt changes seasonal illumination</text><circle cx="300" cy="176" r="33" fill="#efc15a"/><circle cx="110" cy="176" r="42" fill="#629fba"/><path d="M110 134A42 42 0 0 1 110 218Z" fill="#d0e9ed"/><circle cx="490" cy="176" r="42" fill="#629fba"/><path d="M490 134A42 42 0 0 0 490 218Z" fill="#d0e9ed"/><path d="M82 232L138 120M462 232L518 120" stroke="#183e50" stroke-width="3"/><path d="M258 176H166M342 176H434" stroke="#d1a63f" stroke-width="3"/><text x="132" y="105">N</text><text x="511" y="105">N</text><text x="281" y="240">Sun</text><text x="41" y="277">North: summer</text><text x="405" y="277">North: winter</text><text x="24" y="316">Axes keep the same direction around the orbit.</text></svg>