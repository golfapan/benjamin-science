<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 410" role="img"><rect width="410" height="410" rx="12" fill="#f2f8f8"/><g font-family="Arial,sans-serif" fill="#183e59" font-size="18"><text x="24" y="36" font-size="18" text-anchor="start" fill="#183e59">ACROSS ONE MAIN-GROUP PERIOD</text><circle cx="65" cy="95" r="31" fill="#bcdad8" stroke="#167f79"/><circle cx="175" cy="95" r="24" fill="#bcdad8" stroke="#167f79"/><circle cx="285" cy="95" r="17" fill="#bcdad8" stroke="#167f79"/><text x="24" y="154" font-size="18" text-anchor="start" fill="#183e59">Same occupied-shell count</text><text x="24" y="182" font-size="18" text-anchor="start" fill="#183e59">Stronger attraction → generally smaller</text><path d="M24 207H386" stroke="#cadcde"/><text x="24" y="241" font-size="18" text-anchor="start" fill="#183e59">DOWN ONE MAIN-GROUP COLUMN</text><circle cx="65" cy="297" r="17" fill="#bed5e5" stroke="#183e59"/><circle cx="175" cy="297" r="24" fill="#bed5e5" stroke="#183e59"/><circle cx="285" cy="297" r="31" fill="#bed5e5" stroke="#183e59"/><text x="24" y="356" font-size="18" text-anchor="start" fill="#183e59">Extra shells and more shielding</text><text x="24" y="384" font-size="18" text-anchor="start" fill="#183e59">Generally larger; removal often easier</text></g></svg>