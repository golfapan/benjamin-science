<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img"><title>Synthetic chromatograms in two solvents</title><rect width="720" height="350" fill="#fafcfe"/><g font-family="Arial,sans-serif" font-size="18" fill="#17324d"><text x="30" y="30" >One separation can hide a mixture; a second can resolve it</text><rect x="60" y="65" width="240" height="220" fill="white" stroke="#b0c5d7"/><line x1="70" y1="265" x2="290" y2="265" stroke="#41627d" stroke-width="2" /><line x1="70" y1="85" x2="290" y2="85" stroke="#41627d" stroke-width="2" stroke-dasharray="5 4"/><text x="120" y="320" >Solvent A</text><text x="124" y="305" >U</text><circle cx="130" cy="157.0" r="9" fill="#007f89"/><text x="224" y="305" >S</text><circle cx="230" cy="157.0" r="9" fill="#007f89"/><rect x="400" y="65" width="240" height="220" fill="white" stroke="#b0c5d7"/><line x1="410" y1="265" x2="630" y2="265" stroke="#41627d" stroke-width="2" /><line x1="410" y1="85" x2="630" y2="85" stroke="#41627d" stroke-width="2" stroke-dasharray="5 4"/><text x="460" y="320" >Solvent B</text><text x="464" y="305" >U</text><circle cx="470" cy="220.0" r="9" fill="#007f89"/><circle cx="470" cy="148.0" r="9" fill="#007f89"/><text x="564" y="305" >S</text><circle cx="570" cy="148.0" r="9" fill="#007f89"/><text x="260" y="60" font-size="15">Dashed line: solvent front</text></g></svg>