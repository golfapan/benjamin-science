<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" role="img" aria-labelledby="title desc"><title id="title">Two different wave graphs</title><desc id="desc">Top: displacement against position at one instant, with one wavelength marked. Bottom: displacement against time at one fixed position, with one period marked. Both use the same vertical displacement axis.</desc><rect width="400" height="332" rx="12" fill="#f3f8f7"/><g font-family="Arial,sans-serif" font-size="13" fill="#173d5f"><text x="20" y="25" font-weight="bold">Snapshot: many positions, one instant</text><text x="20" y="183" font-weight="bold">Time trace: one position, many instants</text><text x="24" y="49">y</text><text x="24" y="207">y</text><text x="283" y="141">position x (m)</text><text x="304" y="301">time t (s)</text><text x="148" y="57">one wavelength λ</text><text x="159" y="215">one period T</text></g><g fill="none" stroke="#718297" stroke-width="1.2"><path d="M40 52V130M40 98H369M40 210V288M40 256H369"/></g><g fill="none" stroke="#0c7a72" stroke-width="2.5"><path d="M45 98C65 98 65 66 85 66S105 130 125 130S145 66 165 66S185 130 205 130S225 66 245 66S265 130 285 130S305 66 325 66S345 98 365 98"/><path d="M45 256C65 256 65 224 85 224S105 288 125 288S145 224 165 224S185 288 205 288S225 224 245 224S265 288 285 288S305 224 325 224S345 256 365 256"/></g><g stroke="#6b4f9e" stroke-width="1.5" fill="none"><path d="M165 61V48M245 61V48M165 50H245M165 219V206M245 219V206M165 208H245"/></g><g font-family="Arial,sans-serif" font-size="12" fill="#53667a"><text x="20" y="321">y = signed displacement from equilibrium (m)</text></g></svg>
