<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-label="Surface measurements for one day"><rect width="600" height="330" rx="16" fill="#edf7f6"/><style>text{font:20px Arial,sans-serif;fill:#183e50}.head{font-weight:700;font-size:24px}.small{font-size:17px}.line{stroke:#287d83;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#287d83"/></marker></defs><text class="head" x="24" y="36">Surface measurements for one day</text><path d="M24 100H576M24 151H576M24 202H576M24 253H576" stroke="#a1bfc1"/><text x="25" y="83">Measurement</text><text x="320" y="83">Winter</text><text x="457" y="83">Summer</text><text x="25" y="134">Higher-flux interval</text><text x="320" y="134">8 h</text><text x="457" y="134">8 h</text><text x="25" y="185">That surface flux</text><text x="320" y="185">300</text><text x="457" y="185">500</text><text x="25" y="236">Other daylight interval</text><text x="320" y="236">0 h</text><text x="457" y="236">4 h</text><text x="25" y="287">That surface flux</text><text x="320" y="287">—</text><text x="457" y="287">200</text><text class="small" x="25" y="319">Flux units: W/m² on the stated horizontal surface.</text></svg>