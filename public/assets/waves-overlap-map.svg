<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 212" role="img" aria-labelledby="title desc"><title id="title">Add signed displacements at one place</title><desc id="desc">At the same position and instant, pulse one gives plus four millimetres and pulse two gives minus seven millimetres. Their resultant is minus three millimetres, below equilibrium.</desc><rect width="400" height="212" rx="12" fill="#f3f8f7"/><g font-family="Arial,sans-serif" fill="#173d5f"><text x="18" y="25" font-size="13" font-weight="bold">One position, one instant: upward is positive</text><text x="29" y="55" font-size="13">Pulse 1</text><text x="160" y="55" font-size="13">Pulse 2</text><text x="286" y="55" font-size="13">Resultant</text></g><g stroke="#7f8d9c" stroke-width="1" stroke-dasharray="4 3"><path d="M20 112H122M148 112H250M276 112H378"/></g><g fill="none" stroke-width="3"><path d="M72 112V80" stroke="#0c7a72"/><path d="M199 112V168" stroke="#6b4f9e"/><path d="M327 112V136" stroke="#173d5f"/></g><g font-family="Arial,sans-serif" font-size="13" fill="#173d5f"><text x="45" y="73">+4 mm</text><text x="174" y="185">−7 mm</text><text x="303" y="156">−3 mm</text><text x="129" y="116">+</text><text x="260" y="116">=</text><text x="18" y="203" font-size="12">Dashed lines mark zero displacement (equilibrium).</text></g></svg>
