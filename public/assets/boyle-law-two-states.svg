<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Boyle's law shown with the same gas at two volumes</title>
  <desc id="desc">At constant temperature the same particles occupy a large volume at low pressure and a smaller volume at high pressure.</desc>
  <rect width="1200" height="520" rx="28" fill="#f7fbfa"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#143a5b">Boyle’s law: the same gas at constant temperature</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#50657a">Reducing the volume makes wall collisions more frequent, so pressure rises.</text>

  <g transform="translate(75 122)">
    <text x="235" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f776f">STATE 1</text>
    <rect x="0" y="15" width="470" height="245" rx="18" fill="#e4f5f2" stroke="#163b5c" stroke-width="5"/>
    <rect x="20" y="35" width="30" height="205" rx="8" fill="#587087"/>
    <line x1="50" y1="35" x2="50" y2="240" stroke="#163b5c" stroke-width="4"/>
    <g fill="#1d9dbc">
      <circle cx="95" cy="72" r="8"/><circle cx="165" cy="112" r="8"/><circle cx="245" cy="65" r="8"/>
      <circle cx="330" cy="118" r="8"/><circle cx="415" cy="75" r="8"/><circle cx="115" cy="195" r="8"/>
      <circle cx="205" cy="170" r="8"/><circle cx="285" cy="215" r="8"/><circle cx="375" cy="185" r="8"/>
      <circle cx="435" cy="220" r="8"/><circle cx="255" cy="135" r="8"/><circle cx="355" cy="55" r="8"/>
    </g>
    <text x="235" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#143a5b">large volume V₁</text>
    <text x="235" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#143a5b">low pressure P₁</text>
  </g>

  <path d="M557 245 H655" stroke="#e18a35" stroke-width="9" marker-end="url(#arrow)"/>
  <text x="606" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9a5b21">compress</text>

  <g transform="translate(690 122)">
    <text x="215" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f776f">STATE 2</text>
    <rect x="0" y="15" width="430" height="245" rx="18" fill="#e4f5f2" stroke="#163b5c" stroke-width="5"/>
    <rect x="180" y="35" width="30" height="205" rx="8" fill="#587087"/>
    <line x1="210" y1="35" x2="210" y2="240" stroke="#163b5c" stroke-width="4"/>
    <g fill="#1d9dbc">
      <circle cx="235" cy="70" r="8"/><circle cx="280" cy="103" r="8"/><circle cx="330" cy="66" r="8"/>
      <circle cx="385" cy="110" r="8"/><circle cx="245" cy="150" r="8"/><circle cx="300" cy="180" r="8"/>
      <circle cx="360" cy="155" r="8"/><circle cx="405" cy="205" r="8"/><circle cx="265" cy="220" r="8"/>
      <circle cx="340" cy="225" r="8"/><circle cx="395" cy="55" r="8"/><circle cx="315" cy="130" r="8"/>
    </g>
    <text x="310" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#143a5b">smaller volume V₂</text>
    <text x="310" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#143a5b">higher pressure P₂</text>
  </g>

  <rect x="350" y="438" width="500" height="58" rx="16" fill="#143a5b"/>
  <text x="600" y="476" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white">P₁V₁ = P₂V₂</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#e18a35"/></marker></defs>
</svg>
