<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#197d74"/></marker></defs><rect width="560" height="360" rx="15" fill="#f8fbfa"/><g font-family="Arial,sans-serif" font-size="21" fill="#183e59"><text x="24" y="32">Atom, molecule and ion are different counted entities</text><circle cx="90" cy="110" r="23" fill="#197d74"/><text x="38" y="167">one X atom</text><path d="M242 110H288" stroke="#183e59" stroke-width="5"/><circle cx="240" cy="110" r="23" fill="#197d74"/><circle cx="290" cy="110" r="23" fill="#197d74"/><text x="190" y="167">one X₂ molecule</text><text x="185" y="199">contains 2 atoms</text><circle cx="450" cy="110" r="23" fill="#d49a37"/><text x="479" y="91">+</text><text x="389" y="167">one positive ion</text><text x="40" y="268">One mole means 6.02 × 10²³ of the named entity.</text><text x="40" y="307">1 mol X₂ contains 2 mol X atoms.</text></g></svg>